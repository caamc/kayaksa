# One-click publish to Cloudflare for www.kayaksa.com, learn.kayaksa.com and internal.kayaksa.com.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. AI, email and other keys
# are optional and copied to the Workers only when present. Keys are never printed.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Which sites to publish (comma-separated: www, learn, internal, meet, graphiq, or all)"
        default: "www"
        required: true
      replace_dns:
        description: "Replace existing A/AAAA/CNAME records on the site hostnames (never touches MX or TXT email records)"
        type: boolean
        default: false
      sync_brand:
        description: "Upload the brand library to R2 (internal portal)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "scripts/**", "brand-assets/07_Office_Templates_and_Toolbar/**", ".github/workflows/deploy.yml"]

concurrency: { group: deploy, cancel-in-progress: false }

permissions: { contents: read }

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ZONE_NAME: kayaksa.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build shared assets and check types
        run: |
          python3 packages/learnkit/content/build.py
          node scripts/build-assets.mjs
          npm run typecheck

      - name: Choose sites
        id: apps
        run: |
          A="${{ github.event.inputs.apps }}"
          # A push to main republishes the sites listed in the DEPLOY_APPS repository variable (default: all three).
          if [ -z "$A" ]; then A="${{ vars.DEPLOY_APPS || 'www,learn,internal,meet' }},toolbar"; fi
          if [ "$A" = "all" ]; then A="www,learn,internal,meet,toolbar"; fi
          echo "list=$A" >> "$GITHUB_OUTPUT"
          echo "Publishing: $A" >> "$GITHUB_STEP_SUMMARY"

      - name: Check Cloudflare access
        id: cf
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."; exit 1; fi
          V=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.status // "invalid"')
          [ "$V" = "active" ] || V=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -r '.result.status // "invalid"')
          echo "Token status: $V"
          [ "$V" = "active" ] || { echo "::error::The Cloudflare API token is not active."; exit 1; }
          ZJ=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME")
          ZONE=$(echo "$ZJ" | jq -r '.result[0].id // empty')
          [ -n "$ZONE" ] || { echo "::error::The token cannot see the $ZONE_NAME zone. Give it Zone: Read, DNS: Edit and Workers Routes: Edit for kayaksa.com."; exit 1; }
          # Use the account that owns kayaksa.com, whatever the CLOUDFLARE_ACCOUNT_ID secret says.
          ACC=$(echo "$ZJ" | jq -r '.result[0].account.id // empty')
          if [ -n "$ACC" ] && [ "$ACC" != "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Note: the CLOUDFLARE_ACCOUNT_ID secret does not match the account that owns $ZONE_NAME; using the zone's account." >> "$GITHUB_STEP_SUMMARY"
            echo "::add-mask::$ACC"
            echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
          fi
          echo "zone=$ZONE" >> "$GITHUB_OUTPUT"
          echo "Zone $ZONE_NAME found." >> "$GITHUB_STEP_SUMMARY"

      - name: Databases
        run: |
          set -e
          ensure() { # name app binding placeholder
            ID=$(npx wrangler d1 list --json | jq -r --arg n "$1" '.[] | select(.name==$n) | .uuid')
            if [ -z "$ID" ]; then npx wrangler d1 create "$1" --location apac >/dev/null; ID=$(npx wrangler d1 list --json | jq -r --arg n "$1" '.[] | select(.name==$n) | .uuid'); echo "Created database $1" >> "$GITHUB_STEP_SUMMARY"; fi
            [ -n "$ID" ] || { echo "::error::Could not create or find the D1 database $1. The token needs Account: D1 Edit."; exit 1; }
            echo "$ID"
          }
          WWW=$(ensure kayaksa-www) || exit 1; LEARN=$(ensure kayaksa-learn) || exit 1; INTERNAL=$(ensure kayaksa-internal) || exit 1; MEET=$(ensure kayaksa-meet) || exit 1
          sed -i "s/00000000-0000-0000-0000-000000000003/$MEET/" apps/meet/wrangler.jsonc apps/internal/wrangler.jsonc
          sed -i "s/00000000-0000-0000-0000-000000000002/$WWW/" apps/www/wrangler.jsonc apps/internal/wrangler.jsonc
          sed -i "s/00000000-0000-0000-0000-000000000001/$LEARN/" apps/learn/wrangler.jsonc apps/internal/wrangler.jsonc
          sed -i "s/00000000-0000-0000-0000-000000000000/$INTERNAL/" apps/internal/wrangler.jsonc
          sed -i "s/00000000-0000-0000-0000-000000000000/$LEARN/" apps/learn/wrangler.jsonc
          for a in www learn internal meet; do
            case ",${{ steps.apps.outputs.list }}," in *",$a,"*) npx wrangler d1 migrations apply "kayaksa-$a" --remote -c "apps/$a/wrangler.jsonc";; esac
          done

      - name: Check the site addresses in DNS
        env:
          ZONE: ${{ steps.cf.outputs.zone }}
          REPLACE: ${{ github.event.inputs.replace_dns }}
        run: |
          set -e
          hosts=""
          case ",${{ steps.apps.outputs.list }}," in *",www,"*) hosts="$hosts www.kayaksa.com kayaksa.com";; esac
          case ",${{ steps.apps.outputs.list }}," in *",learn,"*) hosts="$hosts learn.kayaksa.com";; esac
          case ",${{ steps.apps.outputs.list }}," in *",internal,"*) hosts="$hosts internal.kayaksa.com";; esac
          case ",${{ steps.apps.outputs.list }}," in *",meet,"*) hosts="$hosts meet.kayaksa.com";; esac
          blocked=0
          for h in $hosts; do
            R=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=$h&per_page=100")
            if [ "$(echo "$R" | jq -r '.success')" != "true" ]; then
              echo "::warning::Cannot read DNS records for $h ($(echo "$R" | jq -r '.errors[0].message')). Skipping the DNS check; publishing will report any conflict. Adding Zone DNS Edit to the token lets this step check first."; echo "- $h: DNS not readable with this token" >> "$GITHUB_STEP_SUMMARY"; continue; fi
            C=$(echo "$R" | jq -c '[.result[] | select((.type=="A" or .type=="AAAA" or .type=="CNAME") and ((.meta.read_only // false) | not))]')
            n=$(echo "$C" | jq 'length')
            if [ "$n" = "0" ]; then echo "- $h: free" >> "$GITHUB_STEP_SUMMARY"; continue; fi
            echo "- $h has existing records:" >> "$GITHUB_STEP_SUMMARY"
            echo "$C" | jq -r '.[] | "  - \(.type) \(.content) (proxied: \(.proxied))"' >> "$GITHUB_STEP_SUMMARY"
            if [ "$REPLACE" = "true" ]; then
              for id in $(echo "$C" | jq -r '.[].id'); do
                curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$id" | jq -e '.success' >/dev/null
              done
              echo "  - replaced (a copy of the old records is listed above)" >> "$GITHUB_STEP_SUMMARY"
            else blocked=1; fi
          done
          if [ "$blocked" = "1" ]; then
            echo "::error::Some site addresses already point elsewhere (see the summary). Run again with 'Replace existing records' ticked to switch them to the new site. Email (MX/TXT) records are never touched."
            exit 1
          fi

      - name: Publish www.kayaksa.com
        if: contains(format(',{0},', steps.apps.outputs.list), ',www,')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION || secrets.BING_SITE_VERIFICATION }}
          CONTACT_PHONE: ${{ secrets.CONTACT_PHONE }}
        run: |
          set -eo pipefail
          CFG=apps/www/wrangler.jsonc
          # Résumés from the careers page: a private bucket (never public), read only by Kayak Internal.
          npx wrangler r2 bucket list | grep -qE "^name:\s+kayaksa-careers$" || npx wrangler r2 bucket create kayaksa-careers || true
          # Kay's answer memory uses Vectorize and Workers AI when the token allows; otherwise it falls back to word matching.
          if ! { npx wrangler vectorize list --json 2>/dev/null | jq -e '.[] | select(.name=="kay-memory")' >/dev/null || npx wrangler vectorize create kay-memory --dimensions=1024 --metric=cosine; }; then
            echo "::warning::The Cloudflare token cannot use Vectorize, so Kay's answer memory uses word matching. Add 'Vectorize: Edit' and 'Workers AI: Read' to the token to switch on meaning-based matching."
            grep -v '"ai": {\|"vectorize":' apps/www/wrangler.jsonc > apps/www/wrangler.deploy.jsonc; CFG=apps/www/wrangler.deploy.jsonc
          fi
          if ! npx wrangler deploy -c $CFG 2>&1 | tee /tmp/d.log; then
            if grep -q 100117 /tmp/d.log; then
              echo "::warning::The site is published, but www.kayaksa.com and kayaksa.com still point to the old website. Remove their A/CNAME records in Cloudflare DNS (keep MX and TXT), then run this workflow again."
              echo "**www.kayaksa.com still points to the old website.** Remove the A/CNAME records for www and the root (keep MX and TXT email records) and run again." >> "$GITHUB_STEP_SUMMARY"
            else exit 1; fi
          fi
          PREVIEW=$(grep -o 'https://kayaksa-www[^ ]*workers.dev' /tmp/d.log | head -1 || true)
          [ -n "$PREVIEW" ] && echo "Preview: $PREVIEW" >> "$GITHUB_STEP_SUMMARY" && echo "$PREVIEW" > /tmp/www-preview
          have=$(npx wrangler secret list --name kayaksa-www --format json 2>/dev/null | jq -r '.[].name' || true)
          node scripts/secrets.mjs ANTHROPIC_API_KEY OPENAI_API_KEY XAI_API_KEY GEMINI_API_KEY RESEND_API_KEY CONTACT_PHONE GOOGLE_SITE_VERIFICATION BING_SITE_VERIFICATION > /tmp/s.json
          echo "$have" | grep -qx STATS_SALT || node -e 'const f="/tmp/s.json";const j=JSON.parse(require("fs").readFileSync(f));j.STATS_SALT=require("crypto").randomBytes(24).toString("base64url");require("fs").writeFileSync(f,JSON.stringify(j))'
          npx wrangler secret bulk /tmp/s.json --name kayaksa-www; rm -f /tmp/s.json
          echo "### www.kayaksa.com published" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish learn.kayaksa.com
        if: contains(format(',{0},', steps.apps.outputs.list), ',learn,')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          KAYAK_GSTIN: ${{ secrets.KAYAK_GSTIN }}
        run: |
          set -e
          npx wrangler deploy -c apps/learn/wrangler.jsonc
          node scripts/secrets.mjs RESEND_API_KEY RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET KAYAK_GSTIN > /tmp/s.json
          [ "$(cat /tmp/s.json)" = "{}" ] || npx wrangler secret bulk /tmp/s.json --name kayaksa-learn; rm -f /tmp/s.json
          echo "### learn.kayaksa.com published" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish internal.kayaksa.com
        if: contains(format(',{0},', steps.apps.outputs.list), ',internal,')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -e
          if ! npx wrangler r2 bucket list | grep -q "kayaksa-brand"; then npx wrangler r2 bucket create kayaksa-brand; echo "NEW_BUCKET=1" >> "$GITHUB_ENV"; fi
          if ! npx wrangler r2 bucket list | grep -qE "^name:\s+kayaksa-meet$"; then npx wrangler r2 bucket create kayaksa-meet || true; fi
          if ! npx wrangler r2 bucket list | grep -q "kayaksa-vault"; then npx wrangler r2 bucket create kayaksa-vault; fi
          if ! npx wrangler r2 bucket list | grep -qE "^name:\s+kayaksa-careers$"; then npx wrangler r2 bucket create kayaksa-careers || true; fi
          npx wrangler deploy -c apps/internal/wrangler.jsonc
          have=$(npx wrangler secret list --name kayaksa-internal --format json 2>/dev/null | jq -r '.[].name' || true)
          node scripts/secrets.mjs ANTHROPIC_API_KEY OPENAI_API_KEY XAI_API_KEY GEMINI_API_KEY RESEND_API_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET > /tmp/s.json
          NEWBOOT=""
          if ! echo "$have" | grep -qx AUTH_ENCRYPTION_KEY; then
            NEWBOOT=$(node -e 'console.log(require("crypto").randomBytes(18).toString("base64url"))')
            node -e 'const f="/tmp/s.json";const j=JSON.parse(require("fs").readFileSync(f));j.AUTH_ENCRYPTION_KEY=require("crypto").randomBytes(32).toString("base64url");j.BOOTSTRAP_TOKEN=process.argv[1];require("fs").writeFileSync(f,JSON.stringify(j))' "$NEWBOOT"
          fi
          # People Masters: personal data is sealed with its own key, generated once and never shown.
          if ! echo "$have" | grep -qx PII_ENCRYPTION_KEY; then
            node -e 'const f="/tmp/s.json";const j=JSON.parse(require("fs").readFileSync(f));j.PII_ENCRYPTION_KEY=require("crypto").randomBytes(32).toString("base64url");require("fs").writeFileSync(f,JSON.stringify(j))'
          fi
          npx wrangler secret bulk /tmp/s.json --name kayaksa-internal; rm -f /tmp/s.json
          echo "### internal.kayaksa.com published" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$NEWBOOT" ]; then
            echo "First-run set-up code (works once, only for the SuperAdmin emails): \`$NEWBOOT\`. Open https://internal.kayaksa.com/setup to create your account and two-factor sign-in." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Add the background-segmentation model to Meet
        if: contains(format(',{0},', steps.apps.outputs.list), ',meet,')
        # Google's open-source MediaPipe selfie segmentation (Apache-2.0), served from meet.kayaksa.com
        # itself so no third party sees the call. Pinned version; never fails the deploy.
        run: |
          set +e
          D=apps/meet/public/seg; mkdir -p "$D" /tmp/mp && cd /tmp/mp
          npm pack @mediapipe/selfie_segmentation@0.1.1675465747 --silent >/dev/null 2>&1 || npm pack @mediapipe/selfie_segmentation --silent >/dev/null 2>&1
          tar xzf mediapipe-selfie_segmentation-*.tgz 2>/dev/null && cd package && cp -f *.js *.wasm *.tflite *.binarypb *.data LICENSE "$GITHUB_WORKSPACE/$D/" 2>/dev/null
          ls -la "$GITHUB_WORKSPACE/$D" || true
          [ -f "$GITHUB_WORKSPACE/$D/selfie_segmentation.js" ] && echo "### Meet backgrounds: segmentation model added" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Could not add the segmentation model; Meet backgrounds will be unavailable until the next deploy."
      - name: Add the face-tracking model for Kayak Avatar
        if: contains(format(',{0},', steps.apps.outputs.list), ',meet,')
        # Google's open-source MediaPipe Face Mesh (Apache-2.0), served from meet.kayaksa.com itself. It runs
        # only in the speaker's browser to animate their avatar. Pinned version; never fails the deploy.
        run: |
          set +e
          D=apps/meet/public/face; mkdir -p "$D" /tmp/fm && cd /tmp/fm
          npm pack @mediapipe/face_mesh@0.4.1633559619 --silent >/dev/null 2>&1 || npm pack @mediapipe/face_mesh --silent >/dev/null 2>&1
          tar xzf mediapipe-face_mesh-*.tgz 2>/dev/null && cd package && cp -f *.js *.wasm *.tflite *.binarypb *.data LICENSE "$GITHUB_WORKSPACE/$D/" 2>/dev/null
          ls -la "$GITHUB_WORKSPACE/$D" || true
          [ -f "$GITHUB_WORKSPACE/$D/face_mesh.js" ] && echo "### Kayak Avatar: face tracking added" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Could not add face tracking; Kayak Avatar will follow voice only until the next deploy."
      - name: Publish meet.kayaksa.com
        if: contains(format(',{0},', steps.apps.outputs.list), ',meet,')
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_TENANT: ${{ secrets.MS_TENANT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -e
          if ! npx wrangler r2 bucket list | grep -qE "^name:\s+kayaksa-meet$"; then npx wrangler r2 bucket create kayaksa-meet || true; fi
          npx wrangler deploy -c apps/meet/wrangler.jsonc
          have=$(npx wrangler secret list --name kayaksa-meet --format json 2>/dev/null | jq -r '.[].name' || true)
          echo '{}' > /tmp/m.json
          # One signing key, shared with the internal portal, which issues the invitation links.
          if ! echo "$have" | grep -qx MEET_SIGNING_KEY; then
            K=$(node -e 'console.log(require("crypto").randomBytes(32).toString("base64url"))')
            node -e 'const f="/tmp/m.json";const j=JSON.parse(require("fs").readFileSync(f));j.MEET_SIGNING_KEY=process.argv[1];require("fs").writeFileSync(f,JSON.stringify(j))' "$K"
            printf '%s' "$K" | npx wrangler secret put MEET_SIGNING_KEY --name kayaksa-internal >/dev/null
            echo "Created the Kayak Meet signing key (shared with the internal portal)." >> "$GITHUB_STEP_SUMMARY"
          fi
          # TURN relay for participants behind strict firewalls (Cloudflare Realtime). Optional.
          if ! echo "$have" | grep -qx TURN_KEY_ID; then
            R=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"name":"kayak-meet"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/calls/turn_keys")
            if [ "$(echo "$R" | jq -r '.success')" = "true" ]; then
              node -e 'const f="/tmp/m.json";const j=JSON.parse(require("fs").readFileSync(f));const r=JSON.parse(process.argv[1]).result;j.TURN_KEY_ID=r.uid;j.TURN_KEY_API_TOKEN=r.key;require("fs").writeFileSync(f,JSON.stringify(j))' "$R"
              echo "Created a TURN relay key for Kayak Meet." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Could not create a TURN relay key ($(echo "$R" | jq -r '.errors[0].message // "unknown"')). Meetings still work; people behind strict firewalls may not connect. Add 'Calls: Edit' (Realtime) to the Cloudflare token to enable the relay."
            fi
          fi
          # Town halls (hundreds of people with video) run on a Cloudflare Realtime SFU app. Created once,
          # automatically, when the Cloudflare token has the Realtime permission. Pay-as-you-go:
          # the first 1,000 GB a month (shared with TURN) is free, then $0.05 per GB of egress.
          if ! echo "$have" | grep -qx CF_REALTIME_APP_ID; then
            R=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"name":"kayak-meet-townhall"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/calls/apps")
            if [ "$(echo "$R" | jq -r '.success')" = "true" ]; then
              node -e 'const f="/tmp/m.json";const j=JSON.parse(require("fs").readFileSync(f));const r=JSON.parse(process.argv[1]).result;j.CF_REALTIME_APP_ID=r.uid;j.CF_REALTIME_APP_SECRET=r.secret;require("fs").writeFileSync(f,JSON.stringify(j))' "$R"
              echo "Created the Cloudflare Realtime app for Meet town halls." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Town halls are off: could not create a Cloudflare Realtime app ($(echo "$R" | jq -r '.errors[0].message // "unknown"')). Add the 'Realtime Admin' (Calls: Edit) permission to the Cloudflare API token."
            fi
          fi
          # Two-way calendar sync: app registrations from Microsoft and Google, kept in GitHub secrets.
          for k in MS_CLIENT_ID MS_CLIENT_SECRET MS_TENANT GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET RESEND_API_KEY; do
            v="${!k}"; [ -n "$v" ] && node -e 'const f="/tmp/m.json";const j=JSON.parse(require("fs").readFileSync(f));j[process.argv[1]]=process.argv[2];require("fs").writeFileSync(f,JSON.stringify(j))' "$k" "$v"
          done
          [ "$(cat /tmp/m.json)" = "{}" ] || npx wrangler secret bulk /tmp/m.json --name kayaksa-meet; rm -f /tmp/m.json
          echo "### meet.kayaksa.com published" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish toolbar.kayaksa.com (KSA Office Toolbar)
        if: contains(format(',{0},', steps.apps.outputs.list), ',toolbar,')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          node scripts/build-toolbar.mjs
          # Go-live checks on the files before anything is published (the browser checks run locally before release).
          NO_BROWSER=1 node scripts/check-toolbar.mjs https://toolbar.kayaksa.com || { echo "::warning::A file check failed; see above."; }
          npx wrangler deploy -c apps/toolbar/wrangler.jsonc
          have=$(npx wrangler secret list --name kayaksa-toolbar --format json 2>/dev/null | jq -r '.[].name' || true)
          echo '{}' > /tmp/t.json
          # One access token for the Assistant, created once and shared with the internal portal, where staff copy it.
          if ! echo "$have" | grep -qx ASSISTANT_TOKEN; then
            K=$(node -e 'console.log(require("crypto").randomBytes(24).toString("base64url"))')
            node -e 'const f="/tmp/t.json";const j=JSON.parse(require("fs").readFileSync(f));j.ASSISTANT_TOKEN=process.argv[1];require("fs").writeFileSync(f,JSON.stringify(j))' "$K"
            printf '%s' "$K" | npx wrangler secret put TOOLBAR_TOKEN --name kayaksa-internal >/dev/null
            echo "Created the KSA Toolbar Assistant token (staff copy it from Kayak Tools in the internal portal)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then node -e 'const f="/tmp/t.json";const j=JSON.parse(require("fs").readFileSync(f));j.ANTHROPIC_API_KEY=process.env.ANTHROPIC_API_KEY;require("fs").writeFileSync(f,JSON.stringify(j))'; fi
          [ "$(cat /tmp/t.json)" = "{}" ] || npx wrangler secret bulk /tmp/t.json --name kayaksa-toolbar; rm -f /tmp/t.json
          echo "### toolbar.kayaksa.com published" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the brand library
        if: github.event.inputs.sync_brand == 'true' || env.NEW_BUCKET == '1'
        run: node scripts/sync-brand.mjs

      - name: Smoke test
        run: |
          sleep 20
          case ",${{ steps.apps.outputs.list }}," in *",www,"*) [ -f /tmp/www-preview ] && curl -fsS "$(cat /tmp/www-preview)/api/health" && echo; curl -fsS -A "Mozilla/5.0 (KayakDeployCheck)" -o /dev/null -w "Kay voice test: %{http_code} %{content_type}\n" -X POST -H "Content-Type: application/json" -H "Origin: https://www.kayaksa.com" -d '{"text":"Hello, I am Kay."}' https://www.kayaksa.com/api/kay/speak || true; curl -fsS https://www.kayaksa.com/api/health && echo || echo "www.kayaksa.com is not on the new site yet";; esac
          case ",${{ steps.apps.outputs.list }}," in *",learn,"*) curl -fsS https://learn.kayaksa.com/healthz && echo;; esac
          case ",${{ steps.apps.outputs.list }}," in *",internal,"*) curl -fsS https://internal.kayaksa.com/healthz && echo;; esac
          case ",${{ steps.apps.outputs.list }}," in *",toolbar,"*) curl -fsS https://toolbar.kayaksa.com/healthz && echo && NO_BROWSER=1 node scripts/check-toolbar.mjs https://toolbar.kayaksa.com || echo "toolbar.kayaksa.com is not answering yet (new address; give DNS a few minutes)";; esac
          case ",${{ steps.apps.outputs.list }}," in *",meet,"*) curl -fsS https://meet.kayaksa.com/healthz && echo || echo "meet.kayaksa.com is not answering yet (new address; give DNS a few minutes)";; esac

      - name: Tell search engines about new and changed pages (IndexNow)
        continue-on-error: true
        run: |
          H=""
          case ",${{ steps.apps.outputs.list }}," in *",www,"*) H="$H www.kayaksa.com";; esac
          case ",${{ steps.apps.outputs.list }}," in *",learn,"*) H="$H learn.kayaksa.com";; esac
          case ",${{ steps.apps.outputs.list }}," in *",meet,"*) H="$H meet.kayaksa.com";; esac
          [ -n "$H" ] && node scripts/indexnow.mjs $H | tee -a "$GITHUB_STEP_SUMMARY" || true

  # Kayak GraphIQ (graphiq.kayaksa.com). A separate job so it stays independent of the other sites.
  # Runs after the main job (which publishes internal, where the /sso/graphiq hand-back lives).
  # On a push to main it runs when the DEPLOY_APPS variable is unset or lists graphiq.
  graphiq:
    needs: deploy
    if: ${{ !cancelled() && ((github.event_name == 'push' && (vars.DEPLOY_APPS == '' || contains(format(',{0},', vars.DEPLOY_APPS), ',graphiq,'))) || github.event.inputs.apps == 'all' || contains(format(',{0},', github.event.inputs.apps), ',graphiq,')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build GraphIQ and run the engine tests
        run: |
          node scripts/build-graphiq.mjs
          npm run typecheck
          npm test
      - name: Publish graphiq.kayaksa.com
        env:
          GRAPHIQ_DATA_KEY_INPUT: ${{ secrets.GRAPHIQ_DATA_KEY }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."; exit 1; fi
          # Use the account that owns kayaksa.com, as the main job does.
          ACC=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" | jq -r '.result[0].account.id // empty')
          if [ -n "$ACC" ]; then echo "::add-mask::$ACC"; export CLOUDFLARE_ACCOUNT_ID="$ACC"; fi
          # Database kayak-graphiq (created once) and its migrations
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="kayak-graphiq") | .uuid')
          if [ -z "$ID" ]; then npx wrangler d1 create kayak-graphiq --location apac >/dev/null; ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="kayak-graphiq") | .uuid'); echo "Created database kayak-graphiq" >> "$GITHUB_STEP_SUMMARY"; fi
          [ -n "$ID" ] || { echo "::error::Could not create or find the D1 database kayak-graphiq. The token needs Account: D1 Edit."; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000006/$ID/" apps/graphiq/wrangler.jsonc
          npx wrangler d1 migrations apply kayak-graphiq --remote -c apps/graphiq/wrangler.jsonc
          # Private bucket for encrypted evidence files
          npx wrangler r2 bucket list | grep -qE "^name:\s+kayak-graphiq-evidence$" || npx wrangler r2 bucket create kayak-graphiq-evidence
          npx wrangler deploy -c apps/graphiq/wrangler.jsonc
          have=$(npx wrangler secret list --name kayaksa-graphiq --format json 2>/dev/null | jq -r '.[].name' || true)
          echo '{}' > /tmp/g.json
          # Single sign-on key, shared with the internal portal (which issues the tickets). Created once.
          if ! echo "$have" | grep -qx GRAPHIQ_SIGNING_KEY; then
            K=$(node -e 'console.log(require("crypto").randomBytes(32).toString("base64url"))')
            node -e 'const f="/tmp/g.json";const j=JSON.parse(require("fs").readFileSync(f));j.GRAPHIQ_SIGNING_KEY=process.argv[1];require("fs").writeFileSync(f,JSON.stringify(j))' "$K"
            printf '%s' "$K" | npx wrangler secret put GRAPHIQ_SIGNING_KEY --name kayaksa-internal >/dev/null
            echo "Created the GraphIQ single sign-on key (shared with the internal portal)." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Evidence encryption key: set once and never replaced (replacing it would make stored evidence unreadable).
          # Taken from the GRAPHIQ_DATA_KEY repository secret when present, otherwise generated here and never shown.
          if ! echo "$have" | grep -qx GRAPHIQ_DATA_KEY; then
            node -e 'const f="/tmp/g.json";const j=JSON.parse(require("fs").readFileSync(f));j.GRAPHIQ_DATA_KEY=process.env.GRAPHIQ_DATA_KEY_INPUT||require("crypto").randomBytes(32).toString("base64url");require("fs").writeFileSync(f,JSON.stringify(j))'
            echo "Set the GraphIQ evidence encryption key." >> "$GITHUB_STEP_SUMMARY"
          fi
          [ "$(cat /tmp/g.json)" = "{}" ] || npx wrangler secret bulk /tmp/g.json --name kayaksa-graphiq; rm -f /tmp/g.json
          echo "### graphiq.kayaksa.com published" >> "$GITHUB_STEP_SUMMARY"
          sleep 15
          curl -fsS https://graphiq.kayaksa.com/healthz && echo || echo "graphiq.kayaksa.com is not answering yet (new address; give DNS a few minutes)"
