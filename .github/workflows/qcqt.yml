# QCQT quality gate. See .qcqt/README.md.
# Make the job named `qcqt-gate` a required status check in branch protection (repository admin).
name: qcqt
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qcqt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Load the trusted policy from main
        id: policy
        run: |
          mkdir -p "$RUNNER_TEMP/trusted"
          if git fetch -q --depth=1 origin main && git show origin/main:.qcqt/policy.json > "$RUNNER_TEMP/trusted/policy.json" 2>/dev/null; then
            echo "source=main" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BOOTSTRAP: main has no .qcqt/policy.json yet, so this run uses the candidate's policy. The gate is not trusted until this change is on main."
            cp .qcqt/policy.json "$RUNNER_TEMP/trusted/policy.json"
            echo "source=candidate" >> "$GITHUB_OUTPUT"
          fi
      - name: Run checks on the candidate (no secrets available)
        run: python3 -m qcqt run --policy "$RUNNER_TEMP/trusted/policy.json" --event "${{ github.event_name == 'workflow_dispatch' && 'push' || github.event_name }}" --out evidence || true
      - name: Summary
        if: always()
        run: |
          f=$(ls evidence/*.json 2>/dev/null | head -1) && python3 -m qcqt report --evidence "$f" >> "$GITHUB_STEP_SUMMARY" || echo "no evidence produced" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"; echo "Policy source: ${{ steps.policy.outputs.source }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qcqt-evidence
          path: |
            evidence/
            reports/qcqt-*.xml
          if-no-files-found: warn
          retention-days: 30
  qcqt-gate:
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the evaluator and policy from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Candidate checkout (used only while main has no QCQT)
        if: ${{ hashFiles('trusted/.qcqt/policy.json') == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - name: Choose evaluator source
        id: src
        run: |
          if [ -f trusted/.qcqt/policy.json ] && [ -d trusted/qcqt ]; then echo "dir=trusted" >> "$GITHUB_OUTPUT"
          else echo "::warning::BOOTSTRAP: main has no QCQT yet, so the evaluator and policy come from the candidate."; echo "dir=candidate" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: qcqt-evidence
          path: evidence
      - name: Evaluate gate (fails closed)
        run: |
          set -euo pipefail
          f=$(ls evidence/evidence/*.json evidence/*.json 2>/dev/null | head -1 || true)
          if [ -z "$f" ]; then echo "No evidence manifest: BLOCKED"; exit 1; fi
          cd "${{ steps.src.outputs.dir }}"
          python3 -m qcqt gate --policy .qcqt/policy.json \
            --event "${{ github.event_name == 'workflow_dispatch' && 'push' || github.event_name }}" \
            --evidence "$GITHUB_WORKSPACE/$f" --head "${{ github.sha }}"
