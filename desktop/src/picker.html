<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
<title>Share your screen</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="picker.css">
</head>
<body>
<header class="drag"><h1>Share your screen</h1><p>Choose what others in the meeting will see. Meet by Kayak's own windows are never shown.</p>
  <div class="tabs nodrag" role="tablist"><button role="tab" data-t="screen" aria-selected="true">Entire screen</button><button role="tab" data-t="window" aria-selected="false">A window</button></div></header>
<main id="grid" role="listbox" aria-label="What to share"><p class="empty">Looking for screens and windows…</p></main>
<footer>
  <label class="aud" id="audwrap"><input type="checkbox" id="aud"> Share computer sound</label>
  <span class="sp"></span>
  <button class="btn" id="cancel">Cancel</button>
  <button class="btn primary" id="share" disabled>Share</button>
</footer>
<script src="picker.js"></script>
</body>
</html>
