<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'">
<title>Meet by Kayak</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="offline.css">
</head>
<body class="drag">
<main class="nodrag">
  <div class="mark"><img src="MeetByKayak_Mark_Reversed.svg" alt="" width="76" height="76"></div>
  <h1 id="h">You're offline</h1>
  <p id="p">Meet by Kayak can't reach Kayak's servers. Check your internet connection or VPN. We'll reconnect as soon as we can.</p>
  <span class="chip" id="s" role="status" aria-live="polite">Waiting for a connection…</span>
  <div class="row">
    <button class="btn primary" id="retry">Try again</button>
    <button class="btn ghost" id="settings">Settings</button>
  </div>
  <small>Press <kbd>Enter</kbd> to try again</small>
</main>
<script src="offline.js"></script>
</body>
</html>
