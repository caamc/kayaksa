<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Self-test · Meet by Kayak</title>
<link rel="icon" href="/_shared/logos/MeetByKayak_Favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/_shared/css/kayak.css">
<link rel="stylesheet" href="/assets/selftest.css">
<script type="module" src="/assets/selftest.js"></script>
</head>
<body>
<header class="st-top"><a class="st-back" href="/app">&larr; Back to Meet</a><img src="/_shared/logos/MeetByKayak_Logo_FullColour.svg" alt="Meet by Kayak" height="26"></header>
<main class="st-main">
  <h1>Self-test</h1>
  <p class="st-lead">Checks what Meet needs on this device and on Kayak's servers, and says in plain words what is not working. Nothing is recorded or kept; your camera and microphone are opened for a moment and closed again.</p>
  <div class="st-row"><button class="st-btn" id="run">Run the test</button><button class="st-btn ghost" id="copy" hidden>Copy the report</button></div>
  <section><h2>This device</h2><ul class="st-list" id="device" aria-live="polite"><li class="st-idle">Not run yet.</li></ul></section>
  <section id="serverBox"><h2>Kayak's servers</h2><ul class="st-list" id="server" aria-live="polite"><li class="st-idle">Not run yet.</li></ul></section>
  <p class="st-note" id="note"></p>
</main>
<noscript><p style="padding:24px">The self-test needs JavaScript.</p></noscript>
</body>
</html>
