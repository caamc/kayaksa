<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · Kayak Internal</title>
<link rel="icon" href="/_shared/logos/KSA_Identifier_FullColour.svg" type="image/svg+xml">
<link rel="stylesheet" href="/_shared/css/kayak.css">
<style>
.auth-film{position:relative;z-index:1;margin:28px 0;display:grid;gap:10px}
.auth-film video{display:block;width:100%;aspect-ratio:16/9;background:#06171E;object-fit:cover}
.auth-film figcaption{display:flex;gap:12px;align-items:center;font-size:.78rem;color:#A9C0C6}
.film-btn{background:none;border:1px solid #3E5563;color:#F3F7F6;font:inherit;padding:4px 10px;cursor:pointer}
.film-btn:focus-visible{outline:2px solid #EE9B1E;outline-offset:2px}
.auth-art.film-on .art-copy h1,.auth-art.film-on .art-copy p{display:none}
@media (max-width:959px){.auth-art.film-on{display:block;padding:16px}.auth-art.film-on>*:not(.auth-film){display:none}.auth-art.film-on .auth-film{margin:0}}
</style>
<script type="module" src="/assets/auth.js"></script>
</head>
<body>
<div class="auth">
  <aside class="auth-art" aria-hidden="true">
    <div id="art-logo"></div>
    <figure class="auth-film" id="film" hidden>
      <video muted playsinline preload="auto" poster="/assets/film/why-kayak-poster.jpg" aria-label="Why Kayak Strategic Advisors: a short film. AI-generated imagery.">
        <source src="/assets/film/why-kayak.webm" type="video/webm"><source src="/assets/film/why-kayak.mp4" type="video/mp4"></video>
      <figcaption><button type="button" class="film-btn" id="filmBtn" aria-label="Pause the film">Pause</button><span>Why Kayak Strategic Advisors · Generated with Kayak AI</span></figcaption>
    </figure>
    <div class="stack art-copy" style="max-width:440px;position:relative;z-index:1">
      <span class="eyebrow" style="color:#F5C46D">Kayak Internal</span>
      <h1>Two paddlers.<br>One course.</h1>
      <p class="serif" style="font-size:1.15rem;color:#CDE8E3">The brand library, our tools, the partner network, Kayak AI, the brand studio and training, in one secure place for the Kayak team.</p>
    </div>
    <p class="small" style="color:#A9C0C6;position:relative;z-index:1">Protected by password and two-factor authentication. Access is logged.</p>
    <svg class="pattern" viewBox="0 0 92 100"><path fill="#17807E" d="M0 0 L30 0 L44 26.25 L44 59.3 Z"/><path fill="#EE9B1E" d="M92 0 L62 0 L48 26.25 L48 59.3 Z"/><path fill="#5DB2AB" d="M32 51 L46 70 L60 51 L60 100 L32 100 Z"/></svg>
  </aside>
  <main class="auth-main">
    <div class="auth-card" id="card" aria-live="polite">
      <div class="row"><span class="spinner" aria-hidden="true"></span><span class="muted">Loading…</span></div>
    </div>
  </main>
</div>
<noscript><p style="padding:24px">Kayak Internal needs JavaScript to sign you in securely.</p></noscript>
</body>
</html>
