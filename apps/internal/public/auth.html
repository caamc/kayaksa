<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · Kayak Internal</title>
<link rel="icon" href="/_shared/logos/KSA_Identifier_FullColour.svg" type="image/svg+xml">
<link rel="stylesheet" href="/_shared/css/kayak.css">
<script type="module" src="/assets/auth.js"></script>
</head>
<body>
<div class="auth">
  <aside class="auth-art" aria-hidden="true">
    <div id="art-logo"></div>
    <div class="stack" style="max-width:440px;position:relative;z-index:1">
      <span class="eyebrow" style="color:#F5C46D">Kayak Internal</span>
      <h1>Two paddlers.<br>One course.</h1>
      <p class="serif" style="font-size:1.15rem;color:#CDE8E3">The brand library, our tools, the partner network, Kayak AI, the brand studio and training, in one secure place for the Kayak team.</p>
    </div>
    <p class="small" style="color:#A9C0C6;position:relative;z-index:1">Protected by password and two-factor authentication. Access is logged.</p>
    <svg class="pattern" viewBox="0 0 92 100"><path fill="#17807E" d="M0 0 L30 0 L44 26.25 L44 59.3 Z"/><path fill="#EE9B1E" d="M92 0 L62 0 L48 26.25 L48 59.3 Z"/><path fill="#5DB2AB" d="M32 51 L46 70 L60 51 L60 100 L32 100 Z"/></svg>
  </aside>
  <main class="auth-main">
    <div class="auth-card" id="card" aria-live="polite">
      <div class="row"><span class="spinner" aria-hidden="true"></span><span class="muted">Loading…</span></div>
    </div>
  </main>
</div>
<noscript><p style="padding:24px">Kayak Internal needs JavaScript to sign you in securely.</p></noscript>
</body>
</html>
